name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x86_64
            asset: Markdown-Studio-windows-x86_64.zip
          - os: ubuntu-latest
            target: linux-x86_64
            asset: Markdown-Studio-linux-x86_64.tar.gz
          - os: macos-latest
            target: macos-universal
            asset: Markdown-Studio-macos-universal.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libgtk-3-dev \
            libatk1.0-dev \
            libgdk-pixbuf2.0-dev \
            libpango1.0-dev \
            libcairo2-dev

      - name: Build Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\markdown_studio.exe "dist\Markdown Studio.exe"
          Copy-Item LICENSE "dist\LICENSE"
          Compress-Archive -Path "dist\*" -DestinationPath "Markdown-Studio-${{ matrix.target }}.zip"

      - name: Build Linux release
        if: runner.os == 'Linux'
        run: |
          cargo build --release
          mkdir -p dist
          cp target/release/markdown_studio dist/markdown_studio
          cp LICENSE dist/LICENSE
          tar -czf "Markdown-Studio-${{ matrix.target }}.tar.gz" -C dist .

      - name: Build macOS universal release
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-darwin/release/markdown_studio \
            target/x86_64-apple-darwin/release/markdown_studio \
            -output dist/markdown_studio
          cp LICENSE dist/LICENSE
          tar -czf "Markdown-Studio-${{ matrix.target }}.tar.gz" -C dist .

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
          generate_release_notes: true
